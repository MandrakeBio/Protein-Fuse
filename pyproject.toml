[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-fuse"
version = "0.1.0"
description = "Protein Fuse: latent translation for protein fitness prediction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
]


[project.scripts]
protein-fuse = "protein_fuse.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
