[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfp-representation-transfer"
version = "0.1.0"
description = "GFP concatenation, reconstruction, and predictor-guided representation transfer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
]


[project.scripts]
gfp-transfer = "gfp_transfer.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
